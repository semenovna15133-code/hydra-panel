{% extends "auth_layout.html" %}

{% block title %}Вход — Hydra Panel{% endblock %}

{% block card %}
<div class="glass fade-up w-full max-w-md rounded-2xl p-8">
    <div class="flex flex-col items-center text-center">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 shadow-glow">
            <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
        </div>
        <h1 class="mt-4 text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 bg-clip-text text-transparent">Hydra Panel</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Вход для администратора</p>
    </div>

    {% if error %}
    <div class="mt-5 flex items-start gap-3 rounded-xl border border-rose-500/30 bg-rose-500/10 p-3.5">
        <svg class="h-5 w-5 shrink-0 text-rose-500" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9.252 3.376c-.866 1.5.217 3.374 1.948 3.374h.009c1.731 0 2.814-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374z" /></svg>
        <p class="text-sm font-medium text-rose-600 dark:text-rose-400">{{ error }}</p>
    </div>
    {% endif %}

    {% if no_admin %}
    <a href="/setup" class="mt-5 block rounded-xl border border-indigo-500/30 bg-indigo-500/10 p-3.5 text-center text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-500/20 transition-colors">
        Первый запуск — создать пароль администратора →
    </a>
    {% else %}
    <form method="post" action="/login" class="mt-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Пароль</label>
            <input type="password" name="password" required autofocus
                   class="mt-1.5 block w-full rounded-xl border-0 bg-white/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300/60 dark:ring-white/10 focus:ring-2 focus:ring-indigo-500">
        </div>
        <label class="flex items-center gap-2.5 text-sm text-slate-600 dark:text-slate-400">
            <input type="checkbox" name="remember" value="on" checked
                   class="h-4 w-4 rounded border-slate-300 dark:border-white/20 bg-white/70 dark:bg-white/5 text-indigo-600 focus:ring-indigo-500">
            Запомнить это устройство на 30 дней
        </label>
        <button type="submit"
                class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-2.5 text-sm font-semibold text-white shadow-glow-sm transition-all hover:shadow-glow hover:brightness-110 active:scale-95">
            Войти
        </button>
    </form>
    {% endif %}
</div>
{% endblock %}
