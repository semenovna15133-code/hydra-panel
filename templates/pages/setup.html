{% extends "auth_layout.html" %}

{% block title %}Первый запуск — Hydra Panel{% endblock %}

{% block card %}
<div class="glass fade-up w-full max-w-md rounded-2xl p-8">
    <div class="flex flex-col items-center text-center">
        <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 shadow-glow">
            <svg class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>
        <h1 class="mt-4 text-xl font-bold tracking-tight text-slate-900 dark:text-white">Первый запуск</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Создай пароль администратора панели</p>
    </div>

    {% if error %}
    <div class="mt-5 rounded-xl border border-rose-500/30 bg-rose-500/10 p-3.5">
        <p class="text-sm font-medium text-rose-600 dark:text-rose-400">{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/setup" class="mt-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Пароль (минимум 8 символов)</label>
            <input type="password" name="password" required minlength="8" autofocus
                   class="mt-1.5 block w-full rounded-xl border-0 bg-white/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300/60 dark:ring-white/10 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Повтори пароль</label>
            <input type="password" name="password2" required minlength="8"
                   class="mt-1.5 block w-full rounded-xl border-0 bg-white/70 dark:bg-white/5 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white ring-1 ring-inset ring-slate-300/60 dark:ring-white/10 focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 px-4 py-2.5 text-sm font-semibold text-white shadow-glow-sm transition-all hover:shadow-glow hover:brightness-110 active:scale-95">
            Создать и войти
        </button>
    </form>
</div>
{% endblock %}
