<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hydra Panel{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(99, 102, 241, 0.35)',
                        'glow-sm': '0 0 12px rgba(99, 102, 241, 0.25)',
                        'glass': '0 8px 32px rgba(2, 6, 23, 0.10)',
                        'glass-dark': '0 8px 32px rgba(0, 0, 0, 0.35)',
                    },
                }
            }
        }
    </script>

    <!-- Тема до первой отрисовки (без мигания) -->
    <script>
        (function () {
            var t = localStorage.getItem('hydra-theme');
            if (t === 'light') document.documentElement.classList.remove('dark');
            else document.documentElement.classList.add('dark');
        })();
    </script>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        document.addEventListener('alpine:init', function () {
            Alpine.data('themeSwitch', function () {
                return {
                    dark: document.documentElement.classList.contains('dark'),
                    toggle: function () {
                        this.dark = !this.dark;
                        document.documentElement.classList.toggle('dark', this.dark);
                        localStorage.setItem('hydra-theme', this.dark ? 'dark' : 'light');
                    }
                };
            });
        });
    </script>

    <style>
        [x-cloak] { display: none !important; }

        /* Плавная смена темы */
        html, body { transition: background-color .35s ease, color .35s ease; }
        .glass, .glass-soft, th, td, tr { transition: background-color .3s ease, border-color .3s ease, color .3s ease; }

        /* Стекло */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 8px 32px rgba(2, 6, 23, 0.08);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .glass-soft {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-soft {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Aurora-фон */
        .aurora { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: -1; opacity: .45; }
        .dark .aurora { opacity: .35; }
        .a1 { width: 46vw; height: 46vw; top: -16vw; left: -12vw;
              background: radial-gradient(circle, rgba(99,102,241,.65), transparent 70%);
              animation: drift1 26s ease-in-out infinite alternate; }
        .a2 { width: 38vw; height: 38vw; top: 20vh; right: -14vw;
              background: radial-gradient(circle, rgba(217,70,239,.45), transparent 70%);
              animation: drift2 32s ease-in-out infinite alternate; }
        .a3 { width: 42vw; height: 42vw; bottom: -18vw; left: 24vw;
              background: radial-gradient(circle, rgba(34,211,238,.35), transparent 70%);
              animation: drift3 38s ease-in-out infinite alternate; }
        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(4vw,3vw) scale(1.12); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-3vw,4vw) scale(.92); } }
        @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(3vw,-3vw) scale(1.08); } }

        /* Появление контента */
        @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fade-up .6s cubic-bezier(.22, 1, .36, 1) both; }
        .d1 { animation-delay: .05s } .d2 { animation-delay: .12s } .d3 { animation-delay: .19s }
        .d4 { animation-delay: .26s } .d5 { animation-delay: .33s } .d6 { animation-delay: .40s }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, .35); border-radius: 8px;
            border: 2px solid transparent; background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, .55); background-clip: padding-box; }

        ::selection { background: rgba(99, 102, 241, .35); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen bg-slate-100 text-slate-900 dark:bg-[#0b1120] dark:text-slate-100"
      x-data="{ sidebarOpen: false }">

    <!-- Aurora -->
    <div aria-hidden="true">
        <div class="aurora a1"></div>
        <div class="aurora a2"></div>
        <div class="aurora a3"></div>
    </div>

    <!-- Mobile drawer backdrop -->
    <div x-show="sidebarOpen" x-cloak
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="sidebarOpen = false"
         class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm lg:hidden"></div>

    <!-- Mobile drawer -->
    <div x-show="sidebarOpen" x-cloak
         x-transition:enter="transition-transform ease-out duration-300"
         x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition-transform ease-in duration-200"
         x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
         class="fixed inset-y-0 left-0 z-50 w-72 lg:hidden">
        {% include 'components/sidebar.html' %}
    </div>

    <!-- Desktop sidebar -->
    <aside class="hidden lg:fixed lg:inset-y-0 lg:z-50 lg:flex lg:w-72 lg:flex-col">
        {% include 'components/sidebar.html' %}
    </aside>

    <!-- Main -->
    <div class="lg:pl-72">
        {% include 'components/navbar.html' %}
        <main class="px-4 py-8 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
