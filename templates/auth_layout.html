<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hydra Panel{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                boxShadow: { 'glow': '0 0 20px rgba(99,102,241,.35)', 'glow-sm': '0 0 12px rgba(99,102,241,.25)' }
            } }
        }
    </script>
    <script>(function(){var t=localStorage.getItem('hydra-theme');if(t==='light')document.documentElement.classList.remove('dark');else document.documentElement.classList.add('dark');})();</script>
    <style>
        [x-cloak]{display:none!important}
        html,body{transition:background-color .35s ease,color .35s ease}
        .glass{background:rgba(255,255,255,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 32px rgba(2,6,23,.08)}
        .dark .glass{background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.35)}
        .aurora{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:-1;opacity:.45}
        .dark .aurora{opacity:.35}
        .a1{width:46vw;height:46vw;top:-16vw;left:-12vw;background:radial-gradient(circle,rgba(99,102,241,.65),transparent 70%);animation:drift1 26s ease-in-out infinite alternate}
        .a2{width:38vw;height:38vw;top:20vh;right:-14vw;background:radial-gradient(circle,rgba(217,70,239,.45),transparent 70%);animation:drift2 32s ease-in-out infinite alternate}
        .a3{width:42vw;height:42vw;bottom:-18vw;left:24vw;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 70%);animation:drift3 38s ease-in-out infinite alternate}
        @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,3vw) scale(1.12)}}
        @keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-3vw,4vw) scale(.92)}}
        @keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(3vw,-3vw) scale(1.08)}}
        @keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        .fade-up{animation:fade-up .6s cubic-bezier(.22,1,.36,1) both}
        ::selection{background:rgba(99,102,241,.35)}
    </style>
</head>
<body class="font-sans antialiased min-h-screen bg-slate-100 text-slate-900 dark:bg-[#0b1120] dark:text-slate-100">
    <div aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div></div>
    <main class="relative flex min-h-screen items-center justify-center px-4 py-10">
        {% block card %}{% endblock %}
    </main>
</body>
</html>
